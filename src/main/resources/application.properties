spring.application.name=smart_doc

OPENAI_API_KEY=${OPENAI_API_KEY}

# PostgreSQL: persistent metadata for uploaded documents (name +
# upload timestamp). Qdrant remains the vector store; this database
# does not store chunks, embeddings, or text.
spring.datasource.url=jdbc:postgresql://localhost:5433/smartdoc
spring.datasource.username=smartdoc
spring.datasource.password=smartdoc

# No Flyway in this project yet, so Hibernate creates/updates the
# "documents" table itself. This is the simplest option for a single
# new table -- ask if you'd rather switch to a real migration tool.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Reject any uploaded file bigger than 10 MB. Without this, Spring
# Boot's own default (much smaller) limit would apply and reject
# oversized files before our code ever sees them.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# By default, Spring checks the file size WHILE the request comes in,
# before our controller runs -- so an oversized file would fail as a
# raw framework error instead of one of our own clear UploadResult
# messages. Setting this to true delays that check until the file is
# actually read inside DocumentController, where we can catch it and
# report it nicely (see handleFileTooLarge()).
spring.servlet.multipart.resolve-lazily=true