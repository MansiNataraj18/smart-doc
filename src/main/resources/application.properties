spring.application.name=smart_doc

OPENAI_API_KEY=${OPENAI_API_KEY}

# PostgreSQL: persistent metadata for uploaded documents (name +
# upload timestamp). Qdrant remains the vector store; this database
# does not store chunks, embeddings, or text.
spring.datasource.url=jdbc:postgresql://localhost:5433/smartdoc
spring.datasource.username=smartdoc
spring.datasource.password=smartdoc

# No Flyway in this project yet, so Hibernate creates/updates the
# "documents" table itself. This is the simplest option for a single
# new table -- ask if you'd rather switch to a real migration tool.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Reject any uploaded file bigger than 10 MB. Without this, Spring
# Boot's own default (much smaller) limit would apply and reject
# oversized files before our code ever sees them.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# By default, Spring checks the file size WHILE the request comes in,
# before our controller runs -- so an oversized file would fail as a
# raw framework error instead of one of our own clear UploadResult
# messages. Setting this to true delays that check until the file is
# actually read inside DocumentController, where we can catch it and
# report it nicely (see handleFileTooLarge()).
spring.servlet.multipart.resolve-lazily=true

# Tesseract itself (the actual OCR program, not just the Java library)
# must be installed on this machine first:
#   macOS:   brew install tesseract
#   Linux:   apt install tesseract-ocr
#   Windows: install from https://github.com/UB-Mannheim/tesseract/wiki
#
# Where Tesseract's language data ("tessdata") files live. The default
# below matches a Homebrew install on macOS -- override it for your
# own machine/OS, e.g.:
#   Linux:   /usr/share/tesseract-ocr/5/tessdata
#   Windows: C:/Program Files/Tesseract-OCR/tessdata
ocr.tessdata-path=/opt/homebrew/share/tessdata

# Where the native Tesseract library itself lives (NOT the tessdata
# files above -- this is the actual libtesseract program). Only needed
# if you see an "Unable to load library 'tesseract'" error at startup;
# leave blank if OCR already works without it. The default below
# matches a Homebrew install on Apple Silicon Macs -- run
# `brew --prefix tesseract` and append "/lib" if yours differs
# (e.g. Intel Macs usually use /usr/local/opt/tesseract/lib).
ocr.native-library-path=/opt/homebrew/opt/tesseract/lib