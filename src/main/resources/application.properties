spring.application.name=smart_doc

OPENAI_API_KEY=${OPENAI_API_KEY}

# PostgreSQL: persistent metadata for uploaded documents (name +
# upload timestamp). Qdrant remains the vector store; this database
# does not store chunks, embeddings, or text.
spring.datasource.url=jdbc:postgresql://localhost:5433/smartdoc
spring.datasource.username=smartdoc
spring.datasource.password=smartdoc

# No Flyway in this project yet, so Hibernate creates/updates the
# "documents" table itself. This is the simplest option for a single
# new table -- ask if you'd rather switch to a real migration tool.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false